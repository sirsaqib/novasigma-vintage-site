.cat-card{position:relative;min-height:400px;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;padding:30px 26px;text-decoration:none;transition:transform .35s,box-shadow .35s}
.cat-card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
.cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.cat-card:hover img{transform:scale(1.06)}
.cat-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(26,21,18,.88) 0%,rgba(26,21,18,.25) 55%,rgba(26,21,18,0) 75%)}
.cat-card h3,.cat-card p,.cat-card .go{position:relative;z-index:2}
.cat-card h3{font-family:'Anton';font-size:30px;letter-spacing:1px;color:#fff;margin-bottom:8px}
.cat-card p{font-size:14px;color:rgba(255,255,255,.82);margin:0 0 14px}
.cat-card .go{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:820px){.brand-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.brand-grid{grid-template-columns:1fr}}

/* ---------- Brand page ---------- */
.bp-hero{background:var(--ink);color:#fff;padding:90px 0 70px;position:relative;overflow:hidden}
.bp-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(193,80,46,.25),transparent 60%)}
.bp-hero-inner{position:relative;z-index:2}
.blogo-wrap{background:#fff;border-radius:18px;padding:18px 34px;display:inline-block;margin-bottom:26px}
.blogo-wrap img{height:72px;max-width:280px;object-fit:contain}
.bp-hero h1{font-size:clamp(44px,7vw,88px);margin-bottom:12px}
.bp-hero p{color:rgba(255,255,255,.78);max-width:620px;font-size:17px}
.bp-stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px}
.bp-stats div b{display:block;font-family:'Anton';font-size:30px;color:var(--gold)}
.bp-stats div span{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.cat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:10px}
.cat-tile{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;transition:.3s}
.cat-tile:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.cat-tile img{height:170px;width:100%;object-fit:cover}
.cat-tile div{padding:16px 18px}
.cat-tile h4{font-size:16px;font-weight:700}
.cat-tile span{font-size:13px;color:var(--rust);font-weight:600}
@media(max-width:900px){.cat-tiles{grid-template-columns:repeat(2,1fr)}}
.size-note{background:var(--sand);border-radius:16px;padding:26px 30px;font-size:15px;color:#4c463c}
.size-note b{color:var(--ink)}


/* === Summarize with AI (in-page) === */
.ai-sum-strip{margin-top:32px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);max-width:640px}
.ai-sum-title{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.3px;margin-bottom:14px}
.ai-sum-title .spark{color:#d4a24e;font-size:17px}
.ai-sum-logos{display:flex;gap:10px;flex-wrap:wrap}
.ai-slogo{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .22s ease;padding:0}
.ai-slogo:hover{transform:translateY(-3px) scale(1.07);border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.1)}
.ai-slogo.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.ai-slogo svg{width:48px;height:48px;display:block;border-radius:50%}
.ai-sum-panel{margin-top:16px;background:rgba(22,18,13,.88);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px 22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:aiSlide .35s ease}
@keyframes aiSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ai-sum-phead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-sum-pdot{width:10px;height:10px;border-radius:50%;background:#10a37f;flex-shrink:0}
.ai-sum-phead .lbl{color:#fff;font-size:14px}
.ai-sum-close{margin-left:auto;background:none;border:none;color:#999;font-size:24px;cursor:pointer;line-height:1;padding:2px}
.ai-sum-close:hover{color:#fff}
.ai-sum-text{color:#d8d0bf;font-size:14.5px;line-height:1.7;margin:0;min-height:70px}

/* === WA + More-AI === */
.btn-wa{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:100px;background:#25d366;color:#fff!important;font-weight:700;font-size:15px;text-decoration:none;transition:all .25s ease;font-family:inherit;border:none;cursor:pointer}
.btn-wa:hover{background:#1eb857;transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,211,102,.35)}
.hero-wa-row{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.ai-sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-wa-sm{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:100px;background:#25d366;color:#fff!important;font-weight:700;font-size:14px;text-decoration:none;transition:all .22s ease;font-family:inherit}
.btn-wa-sm:hover{background:#1eb857;transform:translateY(-2px)}
.btn-more-ai{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:100px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:all .22s ease;font-family:inherit}
.btn-more-ai:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.ai-more-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);animation:aiSlide .3s ease}
.ai-more-lbl{color:#8a8272;font-size:13px;margin-right:2px}
.ai-more-btn{padding:9px 18px;border-radius:100px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff!important;font-size:13.5px;font-weight:600;text-decoration:none;transition:all .2s ease;font-family:inherit}
.ai-more-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}

/* === SHOP dropdown === */
.nl-drop{position:relative;display:inline-block}
.drop-btn{background:none;border:none;cursor:pointer;font:inherit;color:inherit;padding:0}
.drop-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(8px);background:#fffdf8;border:1px solid rgba(0,0,0,.1);border-radius:16px;box-shadow:0 20px 55px rgba(0,0,0,.16);padding:20px 22px;display:flex;gap:30px;min-width:440px;opacity:0;pointer-events:none;transition:all .22s ease;z-index:200}
.nl-drop:hover .drop-menu,.nl-drop:focus-within .drop-menu{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.drop-sec{min-width:170px}
.drop-sec>span{display:block;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8a7a5f;margin-bottom:8px}
.drop-sec a{display:block;padding:7px 0;color:#1c1712;text-decoration:none;font-size:14.5px;font-weight:500}
.drop-sec a:hover{color:#b4502a}
@media(max-width:900px){.nl-drop{display:none}}
</style>
</head>
